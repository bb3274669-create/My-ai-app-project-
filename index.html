<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BABLU AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
  height:100vh;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:18px;
  border-bottom:1px solid #222;
}

header h1{font-size:22px}
header p{color:#888;font-size:13px;margin-top:4px}

.chat{
  flex:1;
  padding:20px;
  overflow:auto;
}

.welcome{
  text-align:center;
  margin-top:25vh;
}

.welcome h2{font-size:28px}
.welcome p{color:#888;margin-top:8px}

.input-area{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #222;
}

input{
  flex:1;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#171b25;
  color:white;
  outline:none;
}

button{
  border:0;
  border-radius:12px;
  padding:12px;
  background:#202633;
  color:white;
  font-size:18px;
}

nav{
  display:flex;
  justify-content:space-around;
  padding:10px;
  border-top:1px solid #222;
}

nav button{font-size:13px}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🤖 BABLU AI</h1>
  <p>AI Assistant • Context Aware</p>
</header>

<main class="chat">
  <div class="welcome">
    <h2>Namaste 👋</h2>
    <p>Main Bablu AI hoon. Batao kya karna hai?</p>
  </div>
</main>

<div class="input-area">
  <button>📎</button>
  <input type="text" placeholder="Bablu se kuch pucho...">
  <button>🎤</button>
  <button>➤</button>
</div>

<nav>
  <button>💬 Chat</button>
  <button>🧰 Tools</button>
  <button>🧠 Lab</button>
  <button>⚙️ Settings</button>
</nav>

</div>
<script src="app.js"></script>
</body>
  </html>
